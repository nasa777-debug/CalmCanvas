// -------------------------------------------------------------
// WEB AUDIO PROCEDURAL AMBIENT SYNTHESIS ENGINE
// 100% Client-side synthesized. No broken external mp3 links.
// -------------------------------------------------------------
class ProceduralAudioEngine {
  constructor() {
    this.ctx = null;
    this.isMuted = false;
    this.masterGain = null;
    this.nodes = {};
    this.initialized = false;
  }

  init() {
    if (this.initialized) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      this.ctx = new AudioCtx();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.setValueAtTime(0.75, this.ctx.currentTime);
      this.masterGain.connect(this.ctx.destination);
      this.initialized = true;
    } catch (e) {
      console.warn("Web Audio not supported", e);
    }
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  setMasterVolume(val) {
    if (!this.masterGain || !this.ctx) return;
    this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : val, this.ctx.currentTime, 0.05);
  }

  toggleMute() {
    this.isMuted = !this.isMuted;
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.75, this.ctx.currentTime, 0.05);
    }
    return this.isMuted;
  }

  createNoiseBuffer(type = 'pink') {
    if (!this.ctx) return null;
    const bufferSize = this.ctx.sampleRate * 4;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      if (type === 'pink') {
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.12;
        b6 = white * 0.115926;
      } else {
        data[i] = white * 0.15; // White noise
      }
    }
    return buffer;
  }

  startSound(name, vol = 0.5) {
    this.init();
    this.resume();
    if (!this.ctx || this.nodes[name]) return;

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0, this.ctx.currentTime);
    gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.15);
    gain.connect(this.masterGain);

    if (name === 'rain') {
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.createNoiseBuffer('pink');
      noise.loop = true;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1050, this.ctx.currentTime);

      noise.connect(filter);
      filter.connect(gain);
      noise.start();
      this.nodes[name] = { source: noise, gain, filter };
    } 
    else if (name === 'ocean') {
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.createNoiseBuffer('pink');
      noise.loop = true;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(360, this.ctx.currentTime);
      filter.Q.setValueAtTime(2.2, this.ctx.currentTime);

      // LFO for periodic wave wash
      const lfo = this.ctx.createOscillator();
      lfo.frequency.setValueAtTime(0.1, this.ctx.currentTime); // 10s per tidal cycle
      const lfoGain = this.ctx.createGain();
      lfoGain.gain.setValueAtTime(280, this.ctx.currentTime);

      lfo.connect(filter.frequency);
      noise.connect(filter);
      filter.connect(gain);

      noise.start();
      lfo.start();
      this.nodes[name] = { source: noise, lfo, gain, filter };
    } 
    else if (name === 'fireplace') {
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.createNoiseBuffer('white');
      noise.loop = true;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1400, this.ctx.currentTime);
      filter.Q.setValueAtTime(3.5, this.ctx.currentTime);

      // Low warm drone
      const subOsc = this.ctx.createOscillator();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(65, this.ctx.currentTime);
      const subGain = this.ctx.createGain();
      subGain.gain.setValueAtTime(0.2, this.ctx.currentTime);

      noise.connect(filter);
      filter.connect(gain);
      subOsc.connect(subGain);
      subGain.connect(gain);

      noise.start();
      subOsc.start();
      this.nodes[name] = { source: noise, subOsc, gain };
    } 
    else if (name === 'forest') {
      const noise = this.ctx.createBufferSource();
      noise.buffer = this.createNoiseBuffer('pink');
      noise.loop = true;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(420, this.ctx.currentTime);

      const lfo = this.ctx.createOscillator();
      lfo.frequency.setValueAtTime(0.18, this.ctx.currentTime);
      const lfoGain = this.ctx.createGain();
      lfoGain.gain.setValueAtTime(140, this.ctx.currentTime);

      lfo.connect(filter.frequency);
      noise.connect(filter);
      filter.connect(gain);

      noise.start();
      lfo.start();
      this.nodes[name] = { source: noise, lfo, gain };
    } 
    else if (name === 'drone') {
      // 528 Hz Love/Restoration chord (F2, C3, A3, E4 chord)
      const freqs = [87.3, 130.8, 220.0, 329.6];
      const oscs = freqs.map(f => {
        const osc = this.ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, this.ctx.currentTime);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.1, this.ctx.currentTime);
        osc.connect(g);
        g.connect(gain);
        osc.start();
        return osc;
      });
      this.nodes[name] = { oscs, gain };
    }
  }

  stopSound(name) {
    if (!this.nodes[name] || !this.ctx) return;
    const node = this.nodes[name];
    try {
      node.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.15);
      setTimeout(() => {
        if (node.source) node.source.stop();
        if (node.lfo) node.lfo.stop();
        if (node.subOsc) node.subOsc.stop();
        if (node.oscs) node.oscs.forEach(o => o.stop());
        delete this.nodes[name];
      }, 160);
    } catch(e) {
      delete this.nodes[name];
    }
  }

  setSoundVolume(name, vol) {
    if (this.nodes[name] && this.ctx) {
      this.nodes[name].gain.gain.setTargetAtTime(vol, this.ctx.currentTime, 0.05);
    }
  }

  playSoftChime() {
    this.init();
    this.resume();
    if (!this.ctx) return;
    try {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(528, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(520, this.ctx.currentTime + 3.0);

      gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 3.5);

      osc.connect(gain);
      gain.connect(this.masterGain);
      osc.start();
      osc.stop(this.ctx.currentTime + 3.6);
    } catch (e) {}
  }
}

// Particle Dissolution Canvas for the "Let It Go" thought release
function DissolveCanvas({ text, onComplete }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const width = (canvas.width = canvas.parentElement.clientWidth);
    const height = (canvas.height = 240);

    // Draw the text
    ctx.font = '500 20px "Newsreader", Georgia, serif';
    ctx.fillStyle = '#FAF6F0';
    ctx.textAlign = 'center';
    
    const words = text.split(' ');
    const lines = [];
    let currentLine = '';
    const maxWidth = width * 0.82;

    for (let i = 0; i < words.length; i++) {
      const test = currentLine + words[i] + ' ';
      if (ctx.measureText(test).width > maxWidth && i > 0) {
        lines.push(currentLine);
        currentLine = words[i] + ' ';
      } else {
        currentLine = test;
      }
    }
    lines.push(currentLine);

    const startY = height / 2 - (lines.length * 26) / 2;
    lines.forEach((l, idx) => {
      ctx.fillText(l.trim(), width / 2, startY + idx * 28);
    });

    // Sample pixels into stardust
    const imgData = ctx.getImageData(0, 0, width, height);
    const particles = [];
    const step = 4;

    for (let y = 0; y < height; y += step) {
      for (let x = 0; x < width; x += step) {
        const index = (y * width + x) * 4;
        if (imgData.data[index + 3] > 100) {
          particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 3.2,
            vy: -Math.random() * 2.8 - 0.6,
            radius: Math.random() * 2.5 + 0.8,
            alpha: 1,
            fade: Math.random() * 0.015 + 0.008,
            color: Math.random() > 0.4 ? '233, 224, 206' : '200, 125, 101' // Gold & Terracotta stardust
          });
        }
      }
    }

    ctx.clearRect(0, 0, width, height);
    let animId;
    let progress = 1;

    const render = () => {
      ctx.clearRect(0, 0, width, height);
      let alive = 0;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (p.alpha > 0.01) {
          alive++;
          p.x += p.vx;
          p.y += p.vy;
          p.vx += (Math.random() - 0.5) * 0.12;
          p.alpha -= p.fade;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color}, ${Math.max(0, p.alpha)})`;
          ctx.shadowBlur = 6;
          ctx.shadowColor = `rgba(${p.color}, 0.5)`;
          ctx.fill();
        }
      }

      progress -= 0.012;
      if (alive > 10 && progress > 0) {
        animId = requestAnimationFrame(render);
      } else {
        onComplete();
      }
    };

    render();
    return () => cancelAnimationFrame(animId);
  }, [text, onComplete]);

  return <canvas ref={canvasRef} className="w-full rounded-2xl block my-2" />;
}

// Interactive background canvas with floating pollen/dust motes
function AtmosphericCanvas() {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const onResize = () => {
      if (!canvas) return;
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', onResize);

    const motes = Array.from({ length: 45 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2.8 + 1,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      alpha: Math.random() * 0.35 + 0.1,
      color: Math.random() > 0.5 ? '233, 224, 206' : '124, 142, 123'
    }));

    let animId;
    const draw = () => {
      ctx.clearRect(0, 0, width, height);

      motes.forEach(m => {
        m.x += m.vx;
        m.y += m.vy;
        if (m.x < 0) m.x = width;
        if (m.x > width) m.x = 0;
        if (m.y < 0) m.y = height;
        if (m.y > height) m.y = 0;

        ctx.beginPath();
        ctx.arc(m.x, m.y, m.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${m.color}, ${m.alpha})`;
        ctx.fill();
      });

      animId = requestAnimationFrame(draw);
    };

    draw();
    return () => {
      window.removeEventListener('resize', onResize);
      cancelAnimationFrame(animId);
    };
  }, []);

  return <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-70" />;
}

function RoomVisualCanvas({ roomType }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = canvas.parentElement.clientWidth);
    let height = (canvas.height = canvas.parentElement.clientHeight);

    let animId;

    if (roomType === 'rain') {
      // Rain simulator on glass
      const drops = Array.from({ length: 70 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        speed: Math.random() * 6 + 4,
        len: Math.random() * 18 + 10,
        alpha: Math.random() * 0.4 + 0.2
      }));

      const loop = () => {
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(180, 210, 230, 0.4)';
        ctx.lineWidth = 1.2;

        drops.forEach(d => {
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(d.x - 1, d.y + d.len);
          ctx.stroke();

          d.y += d.speed;
          if (d.y > height) {
            d.y = -20;
            d.x = Math.random() * width;
          }
        });
        animId = requestAnimationFrame(loop);
      };
      loop();
    } else if (roomType === 'ocean') {
      // Slow ocean wave layers
      let step = 0;
      const loop = () => {
        ctx.clearRect(0, 0, width, height);
        step += 0.015;

        for (let j = 0; j < 3; j++) {
          ctx.beginPath();
          ctx.moveTo(0, height);
          for (let x = 0; x <= width; x += 15) {
            const y = height - (60 + j * 30) + Math.sin(x * 0.008 + step + j) * (18 + j * 6);
            ctx.lineTo(x, y);
          }
          ctx.lineTo(width, height);
          ctx.fillStyle = `rgba(108, 131, 155, ${0.15 + j * 0.1})`;
          ctx.fill();
        }
        animId = requestAnimationFrame(loop);
      };
      loop();
    } else if (roomType === 'hearth') {
      // Fireplace embers rising
      const embers = Array.from({ length: 45 }, () => ({
        x: width / 2 + (Math.random() - 0.5) * (width * 0.5),
        y: height - Math.random() * 50,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -Math.random() * 2.2 - 0.8,
        radius: Math.random() * 3 + 1,
        life: Math.random() * 1,
        hue: Math.random() > 0.5 ? '200, 125, 101' : '233, 180, 80'
      }));

      const loop = () => {
        ctx.clearRect(0, 0, width, height);
        embers.forEach(e => {
          e.x += e.vx;
          e.y += e.vy;
          e.life -= 0.008;

          ctx.beginPath();
          ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${e.hue}, ${Math.max(0, e.life)})`;
          ctx.shadowBlur = 8;
          ctx.shadowColor = `rgba(${e.hue}, 0.7)`;
          ctx.fill();

          if (e.life <= 0 || e.y < 0) {
            e.x = width / 2 + (Math.random() - 0.5) * (width * 0.5);
            e.y = height - 20;
            e.life = 1;
          }
        });
        animId = requestAnimationFrame(loop);
      };
      loop();
    } else if (roomType === 'forest') {
      // Gentle sun rays and floating leaves
      const leaves = Array.from({ length: 25 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: Math.random() * 0.8 + 0.2,
        vy: Math.random() * 0.6 + 0.4,
        size: Math.random() * 5 + 3,
        rot: Math.random() * 360,
        vRot: (Math.random() - 0.5) * 2
      }));

      const loop = () => {
        ctx.clearRect(0, 0, width, height);

        // Sunlight wash
        const grad = ctx.createLinearGradient(0, 0, width, height);
        grad.addColorStop(0, 'rgba(233, 224, 206, 0.15)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);

        leaves.forEach(l => {
          l.x += l.vx;
          l.y += l.vy;
          l.rot += l.vRot;

          ctx.save();
          ctx.translate(l.x, l.y);
          ctx.rotate((l.rot * Math.PI) / 180);
          ctx.fillStyle = 'rgba(124, 142, 123, 0.4)';
          ctx.beginPath();
          ctx.ellipse(0, 0, l.size, l.size / 2, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          if (l.y > height) l.y = -10;
          if (l.x > width) l.x = -10;
        });
        animId = requestAnimationFrame(loop);
      };
      loop();
    } else {
      // Starry sky twinkle
      const stars = Array.from({ length: 60 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.8 + 0.5,
        twinkle: Math.random() * Math.PI,
        speed: Math.random() * 0.04 + 0.01
      }));

      const loop = () => {
        ctx.clearRect(0, 0, width, height);
        stars.forEach(s => {
          s.twinkle += s.speed;
          const alpha = 0.3 + Math.sin(s.twinkle) * 0.4;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(239, 231, 218, ${Math.max(0.1, alpha)})`;
          ctx.shadowBlur = 4;
          ctx.shadowColor = 'rgba(239, 231, 218, 0.6)';
          ctx.fill();
        });
        animId = requestAnimationFrame(loop);
      };
      loop();
    }

    return () => cancelAnimationFrame(animId);
  }, [roomType]);

  return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none opacity-80" />;
}

function BreathingOrb({ onComplete, onSkip }) {
  const [phase, setPhase] = useState('Inhale'); // Inhale, Hold, Exhale
  const [counter, setCounter] = useState(4);
  const [cycle, setCycle] = useState(1);
  const totalCycles = 3;

  useEffect(() => {
    const timer = setInterval(() => {
      setCounter(prev => {
        if (prev > 1) return prev - 1;

        if (phase === 'Inhale') {
          setPhase('Hold');
          return 4;
        } else if (phase === 'Hold') {
          setPhase('Exhale');
          return 6;
        } else if (phase === 'Exhale') {
          if (cycle >= totalCycles) {
            clearInterval(timer);
            audioService.playSoftChime();
            setTimeout(() => onComplete(), 800);
            return 0;
          }
          setCycle(c => c + 1);
          setPhase('Inhale');
          return 4;
        }
        return 4;
      });
    }, 1000);

    return () => clearInterval(timer);
  }, [phase, cycle, totalCycles, onComplete]);

  // Smooth CSS scale class
  const scaleClass = phase === 'Inhale' 
    ? 'scale-125 transition-transform duration-[4000ms] ease-out' 
    : phase === 'Hold' 
    ? 'scale-125 transition-transform duration-300' 
    : 'scale-90 transition-transform duration-[6000ms] ease-in-out';

  return (
    <div className="flex flex-col items-center justify-center py-6 text-center">
      <span className="text-xs uppercase tracking-widest text-sanctuary-sand/80 font-mono mb-2">
        Cycle {cycle} of {totalCycles}
      </span>

      <h3 className="font-serif text-3xl md:text-4xl text-sanctuary-cream mb-2 transition-all">
        {phase === 'Inhale' && 'Breathe in softly...'}
        {phase === 'Hold' && 'Gently hold that quiet...'}
        {phase === 'Exhale' && 'Release and soften your shoulders...'}
      </h3>
      <p className="text-sanctuary-warmMuted text-xs md:text-sm max-w-sm mb-10">
        Let your belly soften. You don’t need to force anything.
      </p>

      {/* Dynamic breathing orb with multi-layer glow */}
      <div className="relative w-64 h-64 flex items-center justify-center my-4">
        {/* Outer aura */}
        <div className={`absolute inset-0 rounded-full bg-gradient-to-tr from-sanctuary-terracotta/20 via-sanctuary-sand/20 to-sanctuary-sage/20 blur-3xl ${scaleClass}`} />
        {/* Outer ring */}
        <div className={`absolute w-52 h-52 rounded-full border border-sanctuary-sand/30 ${scaleClass}`} />
        {/* Inner sphere */}
        <div className={`w-36 h-36 rounded-full bg-gradient-to-br from-sanctuary-cream via-sanctuary-sand to-sanctuary-sage/40 shadow-[0_0_60px_rgba(233,224,206,0.35)] flex items-center justify-center ${scaleClass}`}>
          <div className="text-center text-sanctuary-night">
            <span className="block text-3xl font-serif font-semibold">{counter}s</span>
            <span className="text-[10px] font-mono uppercase tracking-widest opacity-80">{phase}</span>
          </div>
        </div>
      </div>

      <div className="mt-10">
        <button
          onClick={onSkip}
          className="px-5 py-2 rounded-full text-xs text-sanctuary-warmMuted hover:text-sanctuary-cream transition"
        >
          Skip to Grounding →
        </button>
      </div>
    </div>
  );
}

function GroundingActivity({ onComplete }) {
  const [index, setIndex] = useState(0);
  const [tapped, setTapped] = useState([]);
  const current = GROUNDING_STEPS[index];

  const handleTap = (num) => {
    if (!tapped.includes(num)) {
      const next = [...tapped, num];
      setTapped(next);
      audioService.playSoftChime();

      if (next.length === current.count) {
        setTimeout(() => {
          if (index < GROUNDING_STEPS.length - 1) {
            setIndex(i => i + 1);
            setTapped([]);
          } else {
            onComplete();
          }
        }, 550);
      }
    }
  };

  return (
    <div className="max-w-xl mx-auto py-4 text-center">
      <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sanctuary-sage/15 border border-sanctuary-sage/30 text-sanctuary-sageLight text-xs mb-4">
        <span>Step {index + 1} of 5</span>
        <span>•</span>
        <span>Sensory Grounding</span>
      </div>

      <h3 className="font-serif text-2xl md:text-3xl text-sanctuary-cream mb-2">
        {current.count} Things You Can {current.sense}
      </h3>
      <p className="text-sanctuary-warmText text-sm md:text-base mb-2">
        {current.prompt}
      </p>
      <p className="text-sanctuary-warmMuted text-xs italic mb-8 max-w-md mx-auto">
        e.g., {current.hint}
      </p>

      {/* Interactive tap leaves */}
      <div className="flex justify-center items-center gap-3 my-6">
        {Array.from({ length: current.count }, (_, i) => i + 1).map(num => {
          const isDone = tapped.includes(num);
          return (
            <button
              key={num}
              onClick={() => handleTap(num)}
              className={`w-12 h-12 rounded-2xl flex items-center justify-center text-sm font-medium transition-all duration-300 ${
                isDone 
                  ? 'bg-sanctuary-sage/40 border-2 border-sanctuary-sage text-sanctuary-cream scale-105 shadow-md shadow-sanctuary-sage/20' 
                  : 'bg-sanctuary-nightSurface border border-sanctuary-nightBorder text-sanctuary-warmMuted hover:border-sanctuary-sand/40 hover:scale-105'
              }`}
            >
              {isDone ? '✓' : num}
            </button>
          );
        })}
      </div>

      <p className="text-xs text-sanctuary-warmMuted mt-4">
        Tap each numbered stone as you mentally identify it around you.
      </p>
    </div>
  );
}

function FocusMode({ initialTask = 'Quiet Studying' }) {
  const [task, setTask] = useState(initialTask);
  const [minutes, setMinutes] = useState(25);
  const [secondsLeft, setSecondsLeft] = useState(25 * 60);
  const [isActive, setIsActive] = useState(false);
  const [completed, setCompleted] = useState(false);

  useEffect(() => {
    let interval = null;
    if (isActive && secondsLeft > 0) {
      interval = setInterval(() => {
        setSecondsLeft(sec => sec - 1);
      }, 1000);
    } else if (secondsLeft === 0 && isActive) {
      setIsActive(false);
      setCompleted(true);
      audioService.playSoftChime();
    }
    return () => clearInterval(interval);
  }, [isActive, secondsLeft]);

  const selectDuration = (m) => {
    setMinutes(m);
    setSecondsLeft(m * 60);
    setIsActive(false);
    setCompleted(false);
  };

  const toggleTimer = () => {
    if (!isActive) audioService.resume();
    setIsActive(!isActive);
  };

  const resetTimer = () => {
    setIsActive(false);
    setSecondsLeft(minutes * 60);
    setCompleted(false);
  };

  const formatTime = () => {
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  };

  return (
    <div className="max-w-xl mx-auto py-10 px-4 text-center">

        </p>
      </div>

      {/* Timer circular clock face */}
      <div className="relative w-64 h-64 mx-auto my-8 flex items-center justify-center">
        <div className={`absolute inset-0 rounded-full border border-sanctuary-sand/20 transition-all duration-1000 ${isActive ? 'scale-105 shadow-[0_0_40px_rgba(233,224,206,0.15)]' : ''}`} />
        <div className="text-center">
          <div className="font-mono text-5xl font-light tracking-wider text-sanctuary-cream">
            {formatTime()}
          </div>
          <span className="text-[11px] font-mono uppercase tracking-widest text-sanctuary-warmMuted mt-2 block">
            {isActive ? 'In Quiet Flow' : 'Ready When You Are'}

function ReflectionCompanion({ onStartPause }) {
  const [messages, setMessages] = useState([
    {
      sender: 'assistant',
      text: "Hello. I’m your quiet reflection companion. You don't have to carry your burdens all at once here. Tell me what’s feeling hard today—whether it's an exam, a friendship, or feeling behind."
    }
  ]);
  const [input, setInput] = useState('');
  const [crisisAlert, setCrisisAlert] = useState(false);

  const crisisKeywords = ['suicide', 'kill myself', 'end my life', 'want to die', 'harm myself', 'no reason to live'];

  const handleSend = (e) => {
    e.preventDefault();
    if (!input.trim()) return;

    const userText = input.trim();
    setMessages(prev => [...prev, { sender: 'user', text: userText }]);
    setInput('');

    // Safety checks
    const isCrisis = crisisKeywords.some(kw => userText.toLowerCase().includes(kw));
    if (isCrisis) {
      setCrisisAlert(true);
      setTimeout(() => {
        setMessages(prev => [
          ...prev,
          {
            sender: 'assistant',
            text: "I hear how much pain you are holding right now, and I want you to be safe. Please know that you do not have to carry this alone. There are people who care and want to support you right this second.",
            isSafety: true
          }
        ]);
      }, 500);
      return;
    }

    // Empathetic reframing response logic
    setTimeout(() => {
      let reply = "It makes complete sense that you are feeling this friction. Your value as a person isn't tied to today's difficulty.";
      const lower = userText.toLowerCase();

      if (lower.includes('grade') || lower.includes('exam') || lower.includes('study') || lower.includes('fail')) {
        reply = "Academic stress can make it feel like your entire future is on trial right now. But an exam or degree is just a circumstance; it is not the totality of your intelligence or your destiny. Would you like to step into a 3-minute pause or put things down for a moment?";
      } else if (lower.includes('miss') || lower.includes('alone') || lower.includes('lonely') || lower.includes('friend')) {
        reply = "Feeling disconnected or missing someone can ache in a very quiet, heavy way. You don't need to force yourself to smile or pretend it doesn't sting. Be very gentle with yourself this evening.";
      } else if (lower.includes('compare') || lower.includes('behind') || lower.includes('everyone else')) {
        reply = "When you look at others, you see their finished chapter while sitting inside your messy draft. Everyone's timeline unfolds in its own quiet season. You are not late to your own life.";
      }

      setMessages(prev => [...prev, { sender: 'assistant', text: reply }]);
    }, 600);
  };

  return (
    <div className="max-w-2xl mx-auto py-8 px-4 flex flex-col h-[75vh]">
      <div className="text-center pb-4 border-b border-white/10">
        <h3 className="font-serif text-2xl text-sanctuary-cream">Reflection Companion</h3>
        <p className="text-xs text-sanctuary-warmMuted">A thoughtful sounding board. Non-clinical & compassionate.</p>
      </div>

      {crisisAlert && (
        <div className="my-3 p-4 rounded-2xl bg-rose-950/70 border border-rose-400/40 text-rose-200 text-xs">
          <p className="font-semibold text-rose-100 mb-1">If you are in acute distress or need urgent support:</p>
          <p>Please call or text <strong>988</strong> (USA/Canada) or text HOME to <strong>741741</strong>. International resources are available at <a href="https://findahelpline.com" target="_blank" rel="noreferrer" className="underline font-medium">findahelpline.com</a>. You matter and deserve direct support.</p>
        </div>
      )}

      {/* Messages Feed */}
      <div className="flex-1 overflow-y-auto py-4 space-y-3.5 pr-1">
        {messages.map((m, idx) => (
          <div key={idx} className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
            <div className={`max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed ${
              m.sender === 'user' 
                ? 'bg-sanctuary-sand/20 border border-sanctuary-sand/40 text-sanctuary-cream rounded-br-none' 
                : m.isSafety 
                ? 'bg-rose-950/60 border border-rose-400/40 text-rose-100 rounded-bl-none'
                : 'bg-sanctuary-nightSurface border border-sanctuary-nightBorder text-sanctuary-warmText rounded-bl-none font-serif'
            }`}>
              {m.text}
            </div>
          </div>
        ))}
      </div>

      {/* Quick Prompts */}
      <div className="py-2 flex items-center gap-2 overflow-x-auto text-[11px] text-sanctuary-warmMuted">
        <button 
          onClick={() => setInput("I feel like I'm falling behind everyone else in college.")}
          className="whitespace-nowrap px-3 py-1 rounded-full bg-white/5 border border-white/10 hover:border-sanctuary-sand/40 transition"
        >
          "I feel behind everyone"
        </button>
        <button 
          onClick={() => setInput("I studied all day but I still feel like a failure.")}
          className="whitespace-nowrap px-3 py-1 rounded-full bg-white/5 border border-white/10 hover:border-sanctuary-sand/40 transition"
        >
          "I still feel like a failure"
        </button>
        <button 
          onClick={() => onStartPause()}
          className="whitespace-nowrap px-3 py-1 rounded-full bg-sanctuary-sand/15 border border-sanctuary-sand/30 text-sanctuary-sand hover:bg-sanctuary-sand/25 transition"
        >
          🌬️ Take a 3-minute reset
        </button>
      </div>

      {/* Input */}
      <form onSubmit={handleSend} className="pt-2 flex gap-2">
        <input
          type="text"
          value={input}
          onChange={(e) => setInput(e.target.value)}
          placeholder="Share what is troubling you..."
          className="flex-1 px-4 py-3 rounded-2xl bg-sanctuary-nightSurface border border-sanctuary-nightBorder text-sanctuary-warmText placeholder-sanctuary-warmMuted/60 text-sm focus:outline-none focus:border-sanctuary-sand/40"
        />
        <button
          type="submit"
          disabled={!input.trim()}
          className="px-5 py-3 rounded-2xl bg-sanctuary-sand hover:bg-sanctuary-cream text-sanctuary-night font-semibold text-xs transition disabled:opacity-40"
        >
          Send
        </button>
      </form>
    </div>
  );
}

    rain: 0.6,

    forest: 0.5,
    drone: 0.35
  });
  const [masterMuted, setMasterMuted] = useState(false);
  const [isMixerOpen, setIsMixerOpen] = useState(false);

  // Local Storage
  const [journalEntries, setJournalEntries] = useState(() => {
    try {
      const saved = localStorage.getItem('sanctuary_journal');
      return saved ? JSON.parse(saved) : [
        {
          id: 1,
          date: 'Yesterday',
          time: '9:45 PM',
          tag: 'Letting Go',
          text: 'Was comparing myself to people getting internships today. Taking this moment reminded me my path has its own quiet season.'
        }
      ];
    } catch(e) {
      return [];
    }
  });

  const [smallWins, setSmallWins] = useState(() => {
    try {
      const saved = localStorage.getItem('sanctuary_wins');
      return saved ? JSON.parse(saved) : DEFAULT_WINS;
    } catch(e) {
      return DEFAULT_WINS;
    }
  });

  useEffect(() => {
    try {
      localStorage.setItem('sanctuary_journal', JSON.stringify(journalEntries));
    } catch(e) {}
  }, [journalEntries]);

    try {
      localStorage.setItem('sanctuary_wins', JSON.stringify(smallWins));
    } catch(e) {}
  }, [smallWins]);

  // Sound Engine Controls
  const toggleSound = (key) => {
    audioService.init();
    audioService.resume();
    setActiveSounds(prev => {
      const next = { ...prev, [key]: !prev[key] };
      if (next[key]) {
        audioService.startSound(key, soundVolumes[key] || 0.5);
      } else {
        audioService.stopSound(key);
      }
      return next;
    });
  };

  const handleSetSoundVolume = (key, vol) => {
    setSoundVolumes(prev => ({ ...prev, [key]: vol }));
    audioService.setSoundVolume(key, vol);
  };

  const toggleMasterMute = () => {
    const muted = audioService.toggleMute();
    setMasterMuted(muted);
  };

  const setSoundPreset = (presetObj) => {
    audioService.init();
    audioService.resume();
    // Stop all current
    Object.keys(activeSounds).forEach(k => audioService.stopSound(k));
    const nextActive = {};
    const nextVols = { ...soundVolumes };

    Object.entries(presetObj).forEach(([k, vol]) => {
      nextActive[k] = true;
      nextVols[k] = vol;
      audioService.startSound(k, vol);
    });

    setActiveSounds(nextActive);
    setSoundVolumes(nextVols);
  };

  const handleSelectRoom = (room) => {
    setActiveRoom(room);
    audioService.init();
    audioService.resume();
    Object.keys(activeSounds).forEach(k => {
      if (k !== room.soundKey) audioService.stopSound(k);
    });
    audioService.startSound(room.soundKey, soundVolumes[room.soundKey] || 0.5);
    setActiveSounds({ [room.soundKey]: true });
  };

  const startPauseJourney = (emotion = null) => {
    setSelectedEmotion(emotion);
    setPauseStep(emotion ? 1 : 0);
    setView('pause');
  };

  const handleAddJournal = (entry) => {
    setJournalEntries(prev => [entry, ...prev]);

  const handleDeleteJournal = (id) => {
    setJournalEntries(prev => prev.filter(e => e.id !== id));

  const handleToggleWin = (id) => {
    setSmallWins(prev => prev.map(w => w.id === id ? { ...w, done: !w.done } : w));

  const handleAddWin = (text) => {
    setSmallWins(prev => [{ id: Date.now(), text, done: true, time: 'Just now' }, ...prev]);

  const anySoundPlaying = Object.values(activeSounds).some(Boolean);

        >

            S

            <span className="font-serif text-lg tracking-wide text-sanctuary-cream group-hover:text-sanctuary-sand transition">

            <span className="hidden sm:inline-block text-[10px] font-mono text-sanctuary-warmMuted ml-2 tracking-widest uppercase">
              Digital Refuge
            </span>
          </div>
        </button>

              <button
                onClick={() => startPauseJourney(null)}
                className="w-full sm:w-auto px-8 py-3.5 rounded-full bg-gradient-to-r from-sanctuary-sand to-sanctuary-cream hover:bg-white text-sanctuary-night font-semibold text-sm shadow-xl transition hover:scale-102 flex items-center justify-center gap-2"
              >
                <span>Take a Pause</span>
                <span>→</span>
              </button>
              <button
                onClick={() => setView('rooms')}
                className="w-full sm:w-auto px-8 py-3.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/15 text-sanctuary-warmText text-sm font-medium transition"
              >
                Explore Quiet Rooms
              </button>
            </div>

            {/* Emotional Check-in Tray */}
            <div className="w-full max-w-4xl mt-20 pt-12 border-t border-white/5">
              <p className="font-serif text-2xl text-sanctuary-cream mb-2">What are you carrying right now?</p>
              <p className="text-xs text-sanctuary-warmMuted mb-6">Select anything that resonates for a tailored, gentle reset.</p>

              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-left">
                {EMOTIONAL_STATES.map(emo => (
                  <button
                    key={emo.id}
                    onClick={() => startPauseJourney(emo)}
                    className="p-4 rounded-2xl bg-sanctuary-nightSurface/80 border border-sanctuary-nightBorder hover:border-sanctuary-sand/40 hover:bg-sanctuary-sand/5 transition-all text-left flex flex-col justify-between h-28 group"
                  >
                    <span className="text-2xl">{emo.emoji}</span>
                    <div>
                      <div className="text-xs font-semibold text-sanctuary-warmText group-hover:text-sanctuary-sand transition">{emo.label}</div>
                      <div className="text-[10px] text-sanctuary-warmMuted line-clamp-1 mt-0.5">{emo.sub}</div>
                    </div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        )}

        {/* VIEW: PAUSE JOURNEY (5 Stages) */}
        {view === 'pause' && (
          <div className="max-w-3xl mx-auto px-6 py-8">
            {/* Step Breadcrumbs */}
            <div className="flex items-center justify-center gap-2 mb-8 text-xs text-sanctuary-warmMuted">
              {['Feeling', 'Affirm', 'Breathe', 'Ground', 'Release', 'Refocus'].map((stName, idx) => {
                const isCurrent = pauseStep === idx;
                const isPassed = pauseStep > idx;
                return (
                  <div key={stName} className="flex items-center gap-2">
                    <span className={`px-2.5 py-1 rounded-full text-[11px] font-mono ${
                      isCurrent 
                        ? 'bg-sanctuary-sand/20 text-sanctuary-sand border border-sanctuary-sand/40' 
                        : isPassed 
                        ? 'text-sanctuary-sage' 
                        : 'text-stone-600'
                    }`}>
                      {stName}
                    </span>
                    {idx < 5 && <span className="text-stone-700">›</span>}
                  </div>
                );
              })}
            </div>

            {/* Stage 0: Emotional Selection */}
            {pauseStep === 0 && (
              <div className="text-center py-4">
                <h2 className="font-serif text-3xl md:text-4xl text-sanctuary-cream mb-2">What is sitting heavy on your mind?</h2>
                <p className="text-sanctuary-warmMuted text-xs md:text-sm mb-8">Take a moment to name the weight. There is no wrong answer.</p>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5 max-w-xl mx-auto text-left">
                  {EMOTIONAL_STATES.map(emo => (
                    <button
                      key={emo.id}
                      onClick={() => {
                        setSelectedEmotion(emo);
                        setPauseStep(1);
                      }}
                      className="p-4 rounded-2xl bg-sanctuary-nightSurface border border-sanctuary-nightBorder hover:border-sanctuary-sand/40 hover:bg-sanctuary-sand/5 transition-all flex items-center gap-3.5 text-left group"
                    >
                      <span className="text-2xl p-2 rounded-xl bg-white/5">{emo.emoji}</span>
                      <div>
                        <div className="text-sm font-semibold text-sanctuary-warmText group-hover:text-sanctuary-sand">{emo.label}</div>
                        <div className="text-xs text-sanctuary-warmMuted">{emo.sub}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* Stage 1: Tailored Affirmation */}
            {pauseStep === 1 && selectedEmotion && (
              <div className="max-w-xl mx-auto py-8 text-center">
                <div className="text-4xl mb-4">{selectedEmotion.emoji}</div>
                <h3 className="font-serif text-2xl md:text-3xl text-sanctuary-cream mb-4 leading-relaxed">
                  "{selectedEmotion.quote}"
                </h3>
                <p className="text-sanctuary-warmMuted text-xs md:text-sm mb-8">
                  Let’s step into a gentle 3-minute reset. No expectations, no pressure.
                </p>

                <button
                  onClick={() => setPauseStep(2)}
                  className="px-8 py-3 rounded-full bg-sanctuary-sand hover:bg-sanctuary-cream text-sanctuary-night font-semibold text-xs tracking-wide uppercase transition shadow-lg"
                >
                  Begin Breathing Exercise →
                </button>
              </div>
            )}

            {/* Stage 2: Breathing Orb */}
            {pauseStep === 2 && (
              <BreathingOrb 
                onComplete={() => setPauseStep(3)} 
                onSkip={() => setPauseStep(3)} 
              />
            )}

            {/* Stage 3: Grounding 5-4-3-2-1 */}
            {pauseStep === 3 && (
              <GroundingActivity onComplete={() => setPauseStep(4)} />
            )}

            {/* Stage 4: Let It Out (Dissolving Worries) */}
            {pauseStep === 4 && (
              <LetItOutStage 
                emotion={selectedEmotion} 
                onNext={() => setPauseStep(5)}
                onSaveJournal={(text, tag) => {
                  handleAddJournal({
                    id: Date.now(),
                    date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    text,
                    tag
                  });
                }}
              />
            )}

            {/* Stage 5: Re-center & Choices */}
            {pauseStep === 5 && (
              <ReCenterStage 
                onChooseFocus={(task) => {
                  setView('focus');
                }}
                onChooseRest={() => {
                  handleSelectRoom(ROOMS[4]); // Starlit rest room
                  setView('rooms');
                }}
              />
            )}
          </div>
        )}

        {/* VIEW: ROOMS */}
        {view === 'rooms' && (
          <div className="max-w-5xl mx-auto py-8 px-4">
            <div className="text-center max-w-xl mx-auto mb-8">
              <span className="text-xs uppercase font-mono tracking-widest text-sanctuary-sand/80">Virtual Sanctuary</span>
              <h2 className="font-serif text-3xl md:text-4xl text-sanctuary-cream mt-1">Peaceful Rooms</h2>
              <p className="text-sanctuary-warmMuted text-xs md:text-sm mt-2">
                Step into a room designed to soothe your specific state of mind. Ambient sounds automatically tune to the space.
              </p>
            </div>

            {/* Featured Active Room Canvas Window */}
            <div className={`relative rounded-3xl p-6 md:p-10 border border-white/10 shadow-2xl bg-gradient-to-br ${activeRoom.themeBg} transition-all duration-700 overflow-hidden mb-8 min-h-[340px] flex flex-col justify-between`}>
              <RoomVisualCanvas roomType={activeRoom.id} />

              <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h3 className="font-serif text-3xl text-sanctuary-cream">{activeRoom.name}</h3>
                  <p className="text-xs text-sanctuary-sand mt-0.5">{activeRoom.tagline}</p>
                </div>

                <button
                  onClick={() => handleSelectRoom(activeRoom)}
                  className="self-start md:self-auto flex items-center gap-2 px-4 py-2 rounded-full bg-white/10 hover:bg-white/20 border border-white/15 text-xs text-sanctuary-cream backdrop-blur-md transition"
                >
                  <span>🔊 Tune to Room</span>
                </button>
              </div>

              <div className="relative z-10 max-w-md my-6">
                <p className="text-sm md:text-base text-sanctuary-warmText font-serif leading-relaxed">
                  "{activeRoom.desc}"
                </p>
              </div>

              <div className="relative z-10 flex items-center justify-between text-xs text-sanctuary-warmMuted border-t border-white/10 pt-4">
                <span>Procedural Soundscape Active</span>
                <span className="font-mono text-sanctuary-sand uppercase">Safe Refuge</span>
              </div>
            </div>

            {/* Room Selector Grid */}
            <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
              {ROOMS.map(room => {
                const isCurrent = activeRoom.id === room.id;
                return (
                  <button
                    key={room.id}
                    onClick={() => handleSelectRoom(room)}
                    className={`p-4 rounded-2xl border text-left transition-all duration-300 flex flex-col justify-between h-28 ${
                      isCurrent 
                        ? 'bg-sanctuary-sand/20 border-sanctuary-sand text-sanctuary-cream shadow-lg scale-102' 
                        : 'bg-sanctuary-nightSurface border-sanctuary-nightBorder text-sanctuary-warmMuted hover:text-sanctuary-warmText hover:border-sanctuary-sand/30'
                    }`}
                  >
                    <span className="font-serif text-base text-sanctuary-cream font-medium leading-tight">{room.name}</span>
                    <span className="text-[10px] text-sanctuary-warmMuted">Enter Room →</span>
                  </button>
                );
              })}
            </div>
          </div>
        )}

        {/* VIEW: FOCUS MODE */}
        {view === 'focus' && (
          <FocusMode initialTask="Quiet Studying" />
        )}

        {/* VIEW: JOURNAL */}
        {view === 'journal' && (
          <JournalView 
            entries={journalEntries} 
            onAddEntry={handleAddJournal} 
            onDeleteEntry={handleDeleteJournal} 
          />
        )}

        {/* VIEW: SMALL WINS */}
        {view === 'wins' && (
          <SmallWinsView 
            wins={smallWins} 
            onToggleWin={handleToggleWin} 
            onAddWin={handleAddWin} 
          />
        )}

        {/* VIEW: COMPANION */}
        {view === 'companion' && (
          <ReflectionCompanion onStartPause={() => startPauseJourney(null)} />
        )}
      </main>

      {/* Floating Sound Mixer Drawer Modal */}
      <SoundMixerDrawer 
        isOpen={isMixerOpen}
        onClose={() => setIsMixerOpen(false)}
        activeSounds={activeSounds}
        soundVolumes={soundVolumes}
        toggleSound={toggleSound}
        setSoundVolume={handleSetSoundVolume}
        masterMuted={masterMuted}
        toggleMasterMute={toggleMasterMute}
        setSoundPreset={setSoundPreset}
      />

      {/* Mobile Bottom Navigation */}
      <nav className="md:hidden fixed bottom-0 left-0 right-0 z-30 bg-sanctuary-night/95 backdrop-blur-lg border-t border-white/10 px-2 py-2 flex items-center justify-around">
        {[
          { id: 'home', label: 'Home', icon: '🏠' },
          { id: 'pause', label: 'Pause', icon: '🌬️' },
          { id: 'rooms', label: 'Rooms', icon: '🌲' },
          { id: 'focus', label: 'Focus', icon: '⏳' },
          { id: 'journal', label: 'Journal', icon: '📖' },
          { id: 'wins', label: 'Wins', icon: '🌱' }
        ].map(item => {
          const isActive = view === item.id;
          return (
            <button
              key={item.id}
              onClick={() => {
                if (item.id === 'pause') startPauseJourney(null);
                else setView(item.id);
              }}
              className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-xl text-[10px] transition ${
                isActive ? 'text-sanctuary-sand font-semibold' : 'text-sanctuary-warmMuted'
              }`}
            >
              <span className="text-base">{item.icon}</span>
              <span>{item.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
